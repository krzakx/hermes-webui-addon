name: Hermes WebUI
version: "1.0.2"
slug: hermes-webui
description: >-
  Browser-based interface for Hermes Agent. Chat, skills, memory,
  cron jobs, workspace, and more — all from your HA sidebar.
url: https://github.com/krzakx/hermes-webui-addon
arch:
  - amd64
  - aarch64
init: false
host_network: true
map:
  - config:rw
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Hermes WebUI web interface (for Cloudflare tunnel / direct access)
options:
  password: ""
  gateway_url: "http://localhost:8642"
  gateway_api_key: ""
  hermes_home: "/config/.hermes"
schema:
  password: password?
  gateway_url: str?
  gateway_api_key: password?
  hermes_home: str?
